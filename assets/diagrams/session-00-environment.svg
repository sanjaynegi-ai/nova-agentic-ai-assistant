  <g font-family="Arial,Helvetica,sans-serif"><rect x="55" y="145" width="260" height="150" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="3"/><text x="185" y="202" text-anchor="middle" fill="#F8FAFC" font-size="23" font-weight="700">Browser</text><text x="185" y="238" text-anchor="middle" fill="#94A3B8" font-size="17">Owner + learner</text><text x="185" y="270" text-anchor="middle" fill="#22C55E" font-size="15">127.0.0.1 only</text>
  <rect x="420" y="135" width="350" height="170" rx="18" fill="#1E293B" stroke="#2496ED" stroke-width="3"/><text x="595" y="210" text-anchor="middle" fill="#F8FAFC" font-size="26" font-weight="700">Docker · n8n 2.49.5</text><text x="595" y="252" text-anchor="middle" fill="#EA4B71" font-size="18">Community Edition</text>
