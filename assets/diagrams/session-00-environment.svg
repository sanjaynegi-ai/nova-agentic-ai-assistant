<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NOVA Session 0 Environment Architecture</title><desc id="desc">Local browser, self-hosted n8n Docker container, persistent volume, and external credential boundary.</desc>
