<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">NOVA Docker persistence and backup</title><desc id="d">n8n data flows to a named volume and a protected backup archive.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect width="1200" height="600" rx="24" fill="#101827"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="60" fill="#F8FAFC" font-size="32" font-weight="700">NOVA · Session 0 · Persistence</text><text x="55" y="92" fill="#94A3B8" font-size="17">Containers are replaceable; data and encryption material must be protected</text><rect x="70" y="190" width="280" height="150" rx="18" fill="#1E293B" stroke="#EA4B71" stroke-width="3"/><text x="210" y="245" text-anchor="middle" fill="#F8FAFC" font-size="23" font-weight="700">n8n container</text><text x="210" y="282" text-anchor="middle" fill="#94A3B8" font-size="16">/home/node/.n8n</text><rect x="460" y="190" width="280" height="150" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="3"/><text x="600" y="240" text-anchor="middle" fill="#F8FAFC" font-size="23" font-weight="700">Named volume</text><text x="600" y="276" text-anchor="middle" fill="#94A3B8" font-size="16">SQLite · settings · state</text><text x="600" y="307" text-anchor="middle" fill="#F59E0B" font-size="15">survives container replacement</text><rect x="850" y="190" width="280" height="150" rx="18" fill="#1E293B" stroke="#2496ED" stroke-width="3"/><text x="990" y="240" text-anchor="middle" fill="#F8FAFC" font-size="23" font-weight="700">Protected backup</text><text x="990" y="276" text-anchor="middle" fill="#94A3B8" font-size="16">archive + encryption key</text><text x="990" y="307" text-anchor="middle" fill="#F59E0B" font-size="15">stored outside Git</text><path d="M350 265H450" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/><path d="M740 265H840" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/><text x="400" y="247" text-anchor="middle" fill="#94A3B8" font-size="14">mount</text><text x="790" y="247" text-anchor="middle" fill="#94A3B8" font-size="14">backup</text><rect x="460" y="420" width="280" height="80" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="3"/><text x="600" y="470" text-anchor="middle" fill="#EF4444" font-size="18" font-weight="700">down -v deletes the volume</text><text x="1140" y="560" text-anchor="end" fill="#94A3B8" font-size="14">#SkillUpWithSanjay · Sanjay Negi · Gen-AI Architect</text></g></svg>
